name: Linux Engine CI

on:
  push:
    paths:
      - "linux-engine/**"
      - ".github/workflows/linux-engine-ci.yml"
  pull_request:
    paths:
      - "linux-engine/**"
      - ".github/workflows/linux-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linux-engine/requirements.txt
      - name: Run engine tests
        working-directory: linux-engine
        run: python -m unittest discover -s tests -v
      - name: Validate CLI help
        working-directory: linux-engine
        run: python guardian.py --help
